name: Build Android Geode mod

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip zip ninja-build cmake clang

      - name: Install Geode CLI
        run: |
          curl -L -o geode-cli.zip https://github.com/geode-sdk/cli/releases/download/v3.8.0/geode-cli-v3.8.0-linux.zip
          unzip -o geode-cli.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/geode"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/geode" --version

      - name: Install Android64 binaries
        run: geode sdk install-binaries -p android64

      - name: Build package
        run: geode build -p android64

      - name: Upload .geode package
        uses: actions/upload-artifact@v4
        with:
          name: stereo-madness-welcome-android64
          path: '**/*.geode'
