name: Build Android Geode mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            unzip \
            zip \
            jq \
            ninja-build \
            cmake \
            clang

      - name: Install Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main
        with:
          version: v3.8.0

      - name: Check Geode CLI
        run: |
          set -eux
          geode --version
          geode --help

      - name: Create temporary Geode profile
        shell: bash
        run: |
          set -eux

          export CLI_PROFILE="$GITHUB_WORKSPACE/cli-profile"

          mkdir -p "$CLI_PROFILE/geode/mods"
          mkdir -p "$CLI_PROFILE/Contents/geode/mods"

          geode profile add \
            --name GithubActions \
            "$CLI_PROFILE/GeometryDash.exe" \
            android64

      - name: Install Geode SDK
        shell: bash
        run: |
          set -eux

          export GEODE_SDK="$GITHUB_WORKSPACE/geode-sdk"
          echo "GEODE_SDK=$GEODE_SDK" >> "$GITHUB_ENV"

          geode sdk install "$GEODE_SDK"

      - name: Install Android64 Geode binaries
        shell: bash
        run: |
          set -eux

          geode sdk install-binaries \
            --platform android64

      - name: Build mod
        shell: bash
        run: |
          set -eux

          geode build \
            --platform android64 \
            --config Release

      - name: Show generated files
        shell: bash
        run: |
          set -eux
          find "$GITHUB_WORKSPACE" \
            -type f \
            \( -name "*.geode" -o -name "*.zip" \) \
            -print

      - name: Upload Geode package
        uses: actions/upload-artifact@v4
        with:
          name: stereo-madness-welcome-android64
          path: |
            **/*.geode
            **/dist/*.geode
            **/build/**/*.geode
          if-no-files-found: error
